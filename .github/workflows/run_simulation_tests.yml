
name: Run Simulation Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build
      run: |
        go build -o ./simulations/mmar ./cmd/mmar/main.go
        go build -o ./simulations/websocketserver/websocketserver ./simulations/websocketserver/main.go

    - name: Test
      run: go test -v -count=3 ./...
